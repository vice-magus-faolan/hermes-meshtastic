[project]
name = "hermes-meshtastic"
version = "0.1.0"
description = "Hermes-native Meshtastic platform plugin scaffold"
requires-python = ">=3.11"
dependencies = [
  "meshtastic>=2.7,<3",
  "requests>=2.31,<3",
  "pypubsub>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
